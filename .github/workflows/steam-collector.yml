name: Steam catalog collector

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum app details to request in each batch"
        required: false
        default: "3000"
      recovery_attempt:
        description: "Automatic recovery attempt counter"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-catalog-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare persistent data branch
        shell: bash
        run: |
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add data-store origin/data
          else
            git worktree add -b data data-store HEAD
            cd data-store
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p chunks
            printf '{"catalog_offset":0,"last_appid":0,"processed":0,"failed_appids":[],"complete":false}\n' > checkpoint.json
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Initialize persistent data branch"
            git push origin data
          fi

      - name: Install dependencies
        run: python -m pip install --upgrade pip aiohttp

      - name: Validate collector syntax
        run: python -m py_compile scripts/collect.py

      - name: Collect continuously and checkpoint each batch
        id: collect
        shell: bash
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '3000' }}
          MAX_CONCURRENCY: "2"
          REQUEST_INTERVAL: "1.5"
          DATA_DIR: data-store
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          # Stop well before GitHub's job limit so the run can finish cleanly and trigger continuation.
          MAX_RUNTIME_SECONDS=$((250 * 60))
          # Historical 3,000-AppID batches take roughly 80–95 minutes; keep extra headroom.
          MIN_BATCH_BUDGET_SECONDS=$((110 * 60))

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            REMAINING=$((MAX_RUNTIME_SECONDS - ELAPSED))
            if [ "$REMAINING" -lt "$MIN_BATCH_BUDGET_SECONDS" ]; then
              echo "Not enough time for another full batch; checkpoint is saved."
              break
            fi

            echo "Starting next batch from saved checkpoint..."
            python scripts/collect.py

            cd data-store
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update Steam collection checkpoint"
              git push origin HEAD:data
            fi
            cd ..

            if python -c "import json; from pathlib import Path; p=Path('data-store/checkpoint.json'); s=json.loads(p.read_text()) if p.exists() else {}; raise SystemExit(0 if s.get('complete') else 1)"; then
              echo "Steam catalog collection is complete."
              break
            fi
          done

      - name: Continue or recover collector
        if: always() && steps.collect.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$COLLECT_OUTCOME" != "success" ]; then
            echo "Collector step ended with $COLLECT_OUTCOME."
            if [ "$RECOVERY_ATTEMPT" -lt 2 ]; then
              next_attempt=$((RECOVERY_ATTEMPT + 1))
              echo "Dispatching bounded recovery attempt $next_attempt/2 from the last saved checkpoint."
              gh workflow run .github/workflows/steam-collector.yml --repo "$GITHUB_REPOSITORY" --ref main -f recovery_attempt="$next_attempt"
            else
              echo "Automatic recovery limit reached; stopping to avoid an endless failure loop."
              exit 1
            fi
            exit 0
          fi

          complete=$(jq -r '.complete // false' data-store/checkpoint.json)
          failed_count=$(jq '.failed_appids | length' data-store/checkpoint.json)
          if [ "$complete" = "true" ]; then
            if [ "$failed_count" -gt 0 ]; then
              echo "Catalog scan complete with $failed_count unresolved AppIDs retained after retry limits."
            else
              echo "Collection complete with no unresolved AppIDs."
            fi
            echo "No next run will be dispatched."
          else
            echo "Collection is incomplete ($failed_count failed AppIDs currently recorded); dispatching the next collector run."
            gh workflow run .github/workflows/steam-collector.yml --repo "$GITHUB_REPOSITORY" --ref main -f recovery_attempt="0"
          fi
