name: Steam catalog collector

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum app details to request in each batch"
        required: false
        default: "3000"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: steam-catalog-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare persistent data branch
        shell: bash
        run: |
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add data-store origin/data
          else
            git worktree add -b data data-store HEAD
            cd data-store
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p chunks
            printf '{"catalog_offset":0,"last_appid":0,"processed":0,"failed_appids":[],"complete":false}\n' > checkpoint.json
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Initialize persistent data branch"
            git push origin data
          fi

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Collect continuously and checkpoint each batch
        shell: bash
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '3000' }}
          REQUEST_DELAY: "1.5"
          DATA_DIR: data-store
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MAX_RUNTIME_SECONDS=$((330 * 60))

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            if [ "$ELAPSED" -ge "$MAX_RUNTIME_SECONDS" ]; then
              echo "Reached safe runtime limit; next scheduled run will continue from checkpoint."
              break
            fi

            echo "Starting next batch from saved checkpoint..."
            python scripts/collect.py

            cd data-store
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update Steam collection checkpoint"
              git push origin HEAD:data
            fi
            cd ..

            if python -c "import json; from pathlib import Path; p=Path('data-store/checkpoint.json'); s=json.loads(p.read_text()) if p.exists() else {}; raise SystemExit(0 if s.get('complete') else 1)"; then
              echo "Steam catalog collection is complete."
              break
            fi
          done
